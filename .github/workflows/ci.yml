name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mamela-proxmox
      - uses: actions/checkout@v4
        with:
          repository: ieyoukan/mamela
          ref: main
          path: mamela
      # The Go that builds pome/provider.wasm (build.sh): another release gives another program.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Mamela's pinned toolchain (emela, wasmtime) and the Pomes' dependencies
        working-directory: mamela
        run: scripts/install-toolchain.sh
      # Proxmox VE's API schema is not in the repository: the check against it (catalogs,
      # TestAgainstPVESchema) runs where PVE_APIDOC names it, and is skipped here.
      - name: Test
        working-directory: mamela-proxmox
        env:
          GOTOOLCHAIN: local
          GOWORK: "off"
          MAMELA_TOOLCHAIN_DIR: ${{ github.workspace }}/mamela/.tools/bin
          EMELA_POME_CACHE: ${{ github.workspace }}/mamela/.tools/pomes
        run: go vet ./... && go test ./...
