[pome]
name = "github.com/ieyoukan/mamela-proxmox/examples/homelab"
version = "0.1.0"
emela = "0.27.0"

[build]
target = "wasm"

[dependencies]
"github.com/ieyoukan/mamela/pome/mamela" = "v0.3.0"
"github.com/ieyoukan/mamela-proxmox/pome" = "v0.1.0"

[replace]
"github.com/ieyoukan/mamela-proxmox/pome" = { path = "../../pome" }
# Until the Pomes are published: a checkout of github.com/ieyoukan/mamela next to this one.
"github.com/ieyoukan/mamela/pome/mamela" = { path = "../../../mamela/pome/mamela" }
